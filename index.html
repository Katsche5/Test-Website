<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"

      user-scalable=no">

<meta name="theme-color" content="#020006">

<title>I miss you ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020006;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    touch-action: manipulation;
}


/* --------------------------------
   Canvas
-------------------------------- */

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;
}


/* --------------------------------
   Hintergrund
-------------------------------- */

.background {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(120, 0, 70, .30) 0%,
            rgba(45, 0, 30, .16) 32%,
            rgba(0, 0, 0, 0) 72%
        );
}


/* --------------------------------
   Startbildschirm
-------------------------------- */

.start {
    position: fixed;

    z-index: 50;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #020006;

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}


/* verschwindet nach dem Tippen */

.start.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* --------------------------------
   Touch the screen
-------------------------------- */

.start-text {

    color: white;

    font-size: 18px;

    letter-spacing: 2px;

    opacity: .9;

    text-shadow:
        0 0 10px #ff4fa8,
        0 0 25px #ff006f;

    animation:
        textPulse 2s ease-in-out infinite;
}


@keyframes textPulse {

    0%, 100% {
        opacity: .55;
    }

    50% {
        opacity: 1;
    }
}


/* --------------------------------
   I miss you
-------------------------------- */

.message {

    position: fixed;

    z-index: 20;

    left: 50%;
    top: 50%;

    width: 100%;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.6);

    transition:
        opacity 1.5s ease,
        transform 1.5s cubic-bezier(.17,.67,.25,1.3);
}


.message.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}


.message h1 {

    color: white;

        clamp(

    text-shadow:

@keyframes textGlow {

    }
}

</style>
</head>


<body>


<!-- Hintergrund -->

<div class="background"></div>


<!-- Partikel -->

<canvas id="canvas"></canvas>


<!-- Startbildschirm -->

<div
    class="start"
    id="start">

    <div class="start-text">

        Touch the screen

    </div>

</div>


<!-- Nachricht -->

<div
    class="message"
    id="message">

    <h1>
        I miss you
    </h1>

</div>



<script>


/* --------------------------------
   Elemente
-------------------------------- */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");

const start =
    document.getElementById("start");


/* --------------------------------
   Bildschirm
-------------------------------- */

let width;
let height;

let centerX;
let centerY;


function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    centerX =
        width / 2;

    centerY =
        height / 2;
}


resize();


window.addEventListener(
    "resize",
    resize
);



/* --------------------------------
   Einstellungen
-------------------------------- */

const PARTICLE_COUNT = 950;


/*
   Wie lange das Herz entsteht.
   5000 = 5 Sekunden
*/

const FORM_TIME = 5000;



/* --------------------------------
   Herzform
-------------------------------- */

function heartPoint(
    t,
    scale
) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
        Math.cos(t)

        - 5 *
        Math.cos(2 * t)

        - 2 *
        Math.cos(3 * t)

        - Math.cos(4 * t);


    return {

        x:
            centerX +
            x * scale,

        y:
            centerY -
            y * scale
    };
}



/* --------------------------------
   Partikel
-------------------------------- */

class Particle {

    constructor() {


        this.phase =
            Math.random() *
            Math.PI *
            2;


        this.size =
            Math.random() *
            1.7 +
            .5;


        this.alpha =
            Math.random() *
            .7 +
            .3;


        this.spark =
            Math.random();


        this.vx = 0;
        this.vy = 0;



        /*
           Zufälliger Startpunkt
           außerhalb des Herzens
        */

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            120 +

            Math.random() *

            Math.max(
                width,
                height
            ) *
            .55;


        this.x =
            centerX +
            Math.cos(angle) *
            distance;


        this.y =
            centerY +
            Math.sin(angle) *
            distance;



        this.targetX = 0;
        this.targetY = 0;


        this.chooseTarget();
    }



    /* --------------------------------
       Zielpunkt
    -------------------------------- */

    chooseTarget() {


        const t =
            Math.random() *
            Math.PI *
            2;


        /*
           Herzgröße
           passt sich dem Handy an
        */

        const scale =
            Math.min(
                width,
                height
            ) *
            .017;


        const point =
            heartPoint(
                t,
                scale
            );


        /*
           Herz etwas dicker
           aber nicht zu dick
        */

        const thickness = 16;


        this.targetX =
            point.x +

            (
                Math.random() -
                .5
            ) *

            thickness;


        this.targetY =
            point.y +

            (
                Math.random() -
                .5
            ) *

            thickness;
    }



    /* --------------------------------
       Herz entsteht
    -------------------------------- */

    updateForming(time) {


        const dx =
            this.targetX -
            this.x;


        const dy =
            this.targetY -
            this.y;



        this.vx +=
            dx *
            .0018;


        this.vy +=
            dy *
            .0018;



        this.vx *= .91;

        this.vy *= .91;



        this.x +=
            this.vx;


        this.y +=
            this.vy;



        /*
           leichtes Schweben
        */

        this.x +=

            Math.sin(
                time *
                .003 +
                this.phase
            ) *

            .06;


        this.y +=

            Math.cos(
                time *
                .003 +
                this.phase
            ) *

            .06;
    }



    /* --------------------------------
       Herz bleibt
    -------------------------------- */

    updateHeart(time) {


        const dx =
            this.targetX -
            this.x;


        const dy =
            this.targetY -
            this.y;



        this.vx +=
            dx *
            .0005;


        this.vy +=
            dy *
            .0005;



        this.vx *= .90;

        this.vy *= .90;



        this.x +=
            this.vx;


        this.y +=
            this.vy;



        /*
           ganz leichte Bewegung
        */

        this.x +=

            Math.sin(
                time *
                .002 +
                this.phase
            ) *

            .10;


        this.y +=

            Math.cos(
                time *
                .002 +
                this.phase
            ) *

            .10;
    }



    /* --------------------------------
       Zeichnen
    -------------------------------- */

    draw(time) {


        const pulse =

            .7 +

            Math.sin(
                time *
                .004 +
                this.phase
            ) *

            .3;


        const alpha =
            this.alpha *
            pulse;


        const isStar =
            this.spark >
            .94;


        const size =
            this.size *
            (
                isStar
                    ? 2.2
                    : 1
            );



        ctx.save();


        ctx.globalAlpha =
            alpha;



        ctx.shadowBlur =
            isStar
                ? 20
                : 9;


        ctx.shadowColor =
            "#ff3c9d";



        /*
           Farben
        */

        if (
            this.spark >
            .96
        ) {

            ctx.fillStyle =
                "#ffffff";

        }

        else if (
            this.spark >
            .70
        ) {

            ctx.fillStyle =
                "#ffc0e0";

        }

        else {

            ctx.fillStyle =
                "#ff4fa8";
        }



        /*
           Punkt
        */

        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            size,

            0,

            Math.PI * 2
        );


        ctx.fill();



        /*
           Funkelnde Sterne
        */

        if (isStar) {


            ctx.globalAlpha =
                alpha *
                .75;


            ctx.strokeStyle =
                "#ffffff";


            ctx.lineWidth =
                .7;



            ctx.beginPath();



            ctx.moveTo(

                this.x - 7,

                this.y
            );


            ctx.lineTo(

                this.x + 7,

                this.y
            );



            ctx.moveTo(

                this.x,

                this.y - 7
            );


            ctx.lineTo(

                this.x,

                this.y + 7
            );


            ctx.stroke();
        }



        ctx.restore();
    }
}



/* --------------------------------
   Partikel erstellen
-------------------------------- */

const particles = [];


for (
    let i = 0;

    i <
    PARTICLE_COUNT;

    i++
) {

    particles.push(
        new Particle()
    );
}



/* --------------------------------
   Animation
-------------------------------- */

let startTime = null;

let heartFinished = false;

let started = false;



function animate(time) {


    /*
       Startzeit setzen
    */

    if (!startTime) {

        startTime =
            time;
    }



    /*
       Bildschirm löschen
    */

    ctx.clearRect(

        0,

        0,

        width,

        height
    );



    const elapsed =
        time -
        startTime;



    /* --------------------------------
       HERZ ENTSTEHT
    -------------------------------- */

    if (
        elapsed <
        FORM_TIME
    ) {


        particles.forEach(

            p =>
                p.updateForming(
                    time
                )
        );



        const progress =

            Math.min(

                elapsed /
                FORM_TIME,

                1
            );



        /*
           rosa Hintergrund-Glow
        */

        const glow =

            ctx.createRadialGradient(

                centerX,

                centerY,

                0,

                centerX,

                centerY,

                Math.min(
                    width,
                    height
                ) *
                .45
            );



        glow.addColorStop(

            0,

            `rgba(
                255,
                20,
                140,
                ${.02 +
                progress *
                .08}
            )`
        );


        glow.addColorStop(

            1,

            "rgba(255,20,140,0)"
        );



        ctx.fillStyle =
            glow;


        ctx.fillRect(

            0,

            0,

            width,

            height
        );
    }



    /* --------------------------------
       HERZ FERTIG
    -------------------------------- */

    else {


        /*
           Nur einmal ausführen
        */

        if (
            !heartFinished
        ) {


            heartFinished =
                true;



            /*
               I miss you
               erscheint kurz
               nachdem das Herz fertig ist
            */

            setTimeout(

                () => {

                    message.classList.add(
                        "show"
                    );

                },

                300
            );
        }



        /*
           Herz bleibt bestehen
        */

        particles.forEach(

            p =>
                p.updateHeart(
                    time
                )
        );



        /*
           Herz-Glow
        */

        const glow =

            ctx.createRadialGradient(

                centerX,

                centerY,

                0,

                centerX,

                centerY,

                Math.min(
                    width,
                    height
                ) *
                .42
            );



        glow.addColorStop(

            0,

            "rgba(255,20,140,.10)"
        );


        glow.addColorStop(

            .45,

            "rgba(255,20,140,.025)"
        );


        glow.addColorStop(

            1,

            "rgba(255,20,140,0)"
        );



        ctx.fillStyle =
            glow;


        ctx.fillRect(

            0,

            0,

            width,

            height
        );
    }



    /*
       Partikel zeichnen
    */

    particles.forEach(

        p =>
            p.draw(
                time
            )
    );



    /*
       Nächster Frame
    */

    requestAnimationFrame(
        animate
    );
}



/* --------------------------------
   Startfunktion
-------------------------------- */

function begin() {


    /*
       Nur einmal starten
    */

    if (started) {

        return;
    }


    started =
        true;



    /*
       "Touch the screen"
       verschwindet
    */

    start.classList.add(
        "hidden"
    );



    /*
       Animation starten
    */

    startTime =
        performance.now();



    requestAnimationFrame(
        animate
    );
}



/* --------------------------------
   iPhone Touch
-------------------------------- */

window.addEventListener(

    "touchstart",

    begin,

    {
        passive: true
    }
);



/* --------------------------------
   Computer / Maus
-------------------------------- */

window.addEventListener(

    "click",

    begin
);


</script>

</body>
</html>
